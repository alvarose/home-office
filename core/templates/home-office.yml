# home-office configuration. Created by /home-office:init; edit freely.
# Paths are relative to this file.

project: my-project
type: compact                 # compact | multirepo
language: en                  # language of the documents home-office writes for this project; change it with /home-office:language

work: docs/work               # board, features, batches, log
board: BOARD.md
log: log.md

sources:                      # knowledge sources, all optional (/home-office:sources)
  - { name: knowledge, path: docs/knowledge, index: INDEX.md }

repos:                        # each repo: path, roles, checks (must pass to close a TASK),
                              # copy (untracked files a new worktree needs), setup (run once per new worktree)
                              # and prepare (run before the checks of every TASK, e.g. code generators);
                              # copy takes files or folders; base overrides base_branch for one repo;
                              # link: [vendor, node_modules] clones them from the main checkout (hard links)
                              # instead of installing, when the lock files are identical;
                              # advisories (e.g. composer audit): run after the checks, never block, their
                              # output goes to REVIEW.md and the backlog; keep audits out of `checks`.
                              # Formatters go in `prepare`, limited to changed files (vendor/bin/pint --dirty,
                              # ./gradlew ktlintFormat): they fix style before the checks run;
                              # hotspots: [globs] of hot files that only one feature at a time may edit
                              # (e.g. phpstan-baseline.neon, **/values*/strings.xml, lock files, shared config);
                              # task-start refuses a TASK that lists one another feature holds;
                              # mature: true|false overrides ho.py maturity (a mature repo sends more work to the short lane)
  app: { path: ., roles: [backend, frontend], checks: [], advisories: [], copy: [], setup: [], prepare: [], hotspots: [] }

layers: [backend, frontend]   # execution order inside a feature
base_branch: main             # default base for every repo; a repo can set its own `base`
shared_packages: []           # repos published as a dependency of others
worktrees: ../.worktrees      # where feature worktrees are created: <worktrees>/<repo>/<NN-name>

roles:                        # department -> tool and model (/home-office:models)
  conductor:     { tool: claude, model: sonnet }
  classifier:    { tool: claude, model: haiku }
  explorer:      { tool: claude, model: haiku }
  architect:     { tool: claude, model: opus }
  backend:       { tool: claude, model: sonnet }
  frontend:      { tool: claude, model: sonnet }
  reviewer:      { tool: claude, model: sonnet }
  deep-reviewer: { tool: claude, model: opus }
  tuning:        { tool: claude, model: sonnet }
  # custom roles use the generic implementer, e.g.:
  # mobile:      { tool: claude, model: sonnet, description: "Android app (Kotlin, Compose)" }

# current_models: { opus: <full id> } # newest id per family (fable, opus, sonnet, haiku); overrides the
                              # plugin's list (`ho.py models`). Sessions are started with these ids, and a
                              # session on an older generation of its family is warned once

risk_zones: []                # paths or areas that trigger the deep review
hard_rules: []                # rules that must never be broken, in words (for planners and reviewers)
guards: []                    # the enforceable part of the hard rules, checked by the hooks, e.g.:
# - { deny: "database/migrations/**", except: [repo-x], reason: "Migrations only in repo-x" }
generated_from: []            # templates that generate files inside repos; close warns when they change

limits:
  context_tokens: 150000
  tuning_requests: 10
  parallel_warning: 4
  task_attempts: 2
  tasks_per_session: 2        # TASKs a conductor session executes before it closes and hands over
  tasks_per_feature: 8        # over this, the architect proposes trimming or splitting, and you hear it before gate 2
  review_rounds: 1            # review rounds per feature; one more only to check fixes of high or medium findings
                              # (low findings go to REVIEW.md and the project backlog, never to new TASKs unasked)
  gate_seconds: 540           # time cap of the checks gate (the app cancels hooks at ~600 s); over it the gate
                              # records `timeout` and task-end runs the rest, with no cap
  loose_session_hours: 12     # a session opened here without a home-office command (or kept after status) is
                              # warned once at this age: long jobs go to /home-office:task, one step per session
  file_tokens: 4000           # harness weight (ho.py weight): a file sessions load (board, project / stream /
                              # batch pages, open STATE.md, indexes, the repos' CLAUDE.md / AGENTS.md) over this
                              # is flagged by status and close, to compact
  log_rows: 60                # rows the log keeps; close moves older ones to <work>/archive/ (ho.py weight --rotate)
  waiting_days: 30            # acted rows of the waiting inbox older than this move to <work>/archive/ too

handover: card                # at a planned cut, in the Claude desktop app: card = propose the next session
                              # (one click); auto = start it, unless the next step waits for you
archive: ask                  # finished sessions in the Claude desktop app: ask = ask once before archiving; auto = archive
commit: ask                   # TASKs that pass their gate, on the feature branch (never base, never push):
                              # ask = one question per session; auto = commit each TASK when it passes
